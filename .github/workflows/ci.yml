name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  controles:
    uses: itnetgg-web-factory/socle/.github/workflows/controles.yml@v0.1.0

  # Déploiement du code maison (thèmes, extensions, mu-plugins) après chaque fusion dans main.
  # Transport FTPS : o2switch n'ouvre pas SSH aux runners GitHub (adresses variables).
  # Le compte FTP est limité au dossier wp-content du site.
  # Ne touche jamais à la base, à uploads/, au cœur WordPress ni aux extensions installées par le client.
  # Identifiants dans l'environnement GitHub « staging », limité à la branche main.
  deploy:
    name: Déploiement (préproduction)
    needs: [controles]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.PUBLIC_SITE_URL }}
    concurrency:
      group: deploiement-staging
      cancel-in-progress: false
    env:
      FTP_HOST: ${{ vars.FTP_HOST }}
      FTP_USER: ${{ vars.FTP_USER }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Publier le code maison (FTPS)
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Témoin lu par le mu-plugin webfactory-deploiement : il vide le cache des compositions.
          echo "$GITHUB_SHA $(date -u +%Y-%m-%dT%H:%M:%SZ)" > webfactory-deploiement.txt
          {
            echo "set ftp:ssl-force true"
            echo "set ftp:ssl-protect-data true"
            echo "set ssl:verify-certificate true"
            echo "set ftp:passive-mode true"
            echo "set net:timeout 30"
            echo "set net:max-retries 2"
            # Envoi sous un nom provisoire puis renommage : jamais de fichier absent pendant le déploiement.
            echo "set xfer:use-temp-file true"
            echo "set xfer:temp-file-name .depot-*"
            echo "open --env-password -u \"$FTP_USER\" \"ftp://$FTP_HOST\""
            # Chaque thème et chaque extension maison est synchronisé dans son propre dossier :
            # les autres thèmes et extensions du site restent intacts.
            for dossier in themes/*/ plugins/*/; do
              [ -d "$dossier" ] || continue
              echo "mirror -R --delete --overwrite --no-perms --verbose=1 --exclude-glob *.md --exclude-glob .DS_Store ${dossier%/} ${dossier%/}"
            done
            # mu-plugins : fichiers maison uniquement, sans suppression des autres.
            echo "mkdir -p -f mu-plugins"
            for fichier in mu-plugins/*.php; do
              [ -f "$fichier" ] && echo "put -O mu-plugins $fichier"
            done
            echo "put webfactory-deploiement.txt"
          } > deploiement.lftp
          lftp -f deploiement.lftp
          rm -f deploiement.lftp

      - name: Vérifier le site
        run: |
          version=$(sed -n 's/^Version: *//p' themes/webfactory-blocks/style.css)
          for essai in 1 2 3 4 5 6; do
            page=$(curl -s -w '\n%{http_code}' "$PUBLIC_SITE_URL/?deploiement=$GITHUB_SHA")
            code=$(echo "$page" | tail -n 1)
            if [ "$code" = "200" ] && echo "$page" | grep -q "webfactory-blocks/style.css?ver=$version"; then
              echo "Accueil : HTTP 200, thème webfactory-blocks $version en ligne"
              exit 0
            fi
            echo "Essai $essai : HTTP $code, version $version pas encore servie ; nouvel essai dans 15 s"
            sleep 15
          done
          exit 1
